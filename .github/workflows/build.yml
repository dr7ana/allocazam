name: Build

on:
  workflow_call:

jobs:
  build:
    name: ${{ matrix.os }} (${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        compiler: [clang-22, gcc-14, gcc-15, gcc-16]
        include:
          - compiler: clang-22
            cc: clang-22
            cxx: clang++-22
            install_llvm: true
            install_gcc: false
            use_libcxx: ON
          - compiler: gcc-14
            cc: gcc-14
            cxx: g++-14
            install_llvm: false
            install_gcc: true
            use_libcxx: OFF
          - compiler: gcc-15
            cc: gcc-15
            cxx: g++-15
            install_llvm: false
            install_gcc: true
            use_libcxx: OFF
          - compiler: gcc-16
            cc: gcc-16
            cxx: g++-16
            install_llvm: false
            install_gcc: true
            use_libcxx: OFF

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install LLVM (Linux)
        if: ${{ matrix.install_llvm }}
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 22 all
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-22 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-22 100

      - name: Install gcc (Linux)
        if: ${{ matrix.install_gcc }}
        run: |
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test
          sudo apt update -yqq
          sudo apt install -yqq ${{ matrix.cc }} ${{ matrix.cxx }}
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/${{ matrix.cc }} 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/${{ matrix.cxx }} 100

      - name: Enable 2MiB Huge Pages
        run: |
          echo 128 | sudo tee /sys/kernel/mm/hugepages/hugepages-2048kB/nr_hugepages

      - name: Configure
        run: |
          cmake -B build_dbg -G "Unix Makefiles" \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DCMAKE_BUILD_TYPE=Debug
          cmake -B build_rel -G "Unix Makefiles" \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build Debug
        run: make -j
        working-directory: ./build_dbg

      - name: Test Debug
        run: |
          ./tests/allocazam_std_allocator_smoke
          ./tests/allocazam_runner_expand_smoke
          ./tests/allocazam_std_allocator_expand_smoke
          ./tests/allocazam_concurrent_stress
        working-directory: ./build_dbg

      - name: Build Release
        run: make -j
        working-directory: ./build_rel

      - name: Test Release
        run: |
          ./tests/allocazam_std_allocator_smoke
          ./tests/allocazam_runner_expand_smoke
          ./tests/allocazam_std_allocator_expand_smoke
          ./tests/allocazam_concurrent_stress
        working-directory: ./build_rel

  tsan:
    name: tsan (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      CC: clang-22
      CXX: clang++-22
      TSAN_OPTIONS: halt_on_error=1
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install LLVM (Linux)
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 22 all
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-22 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-22 100

      - name: Enable 2MiB Huge Pages
        run: |
          echo 128 | sudo tee /sys/kernel/mm/hugepages/hugepages-2048kB/nr_hugepages

      - name: Configure
        run: |
          cmake -B build_tsan -G "Unix Makefiles" \
            -DCMAKE_C_COMPILER=clang-22 \
            -DCMAKE_CXX_COMPILER=clang++-22 \
            -DCMAKE_BUILD_TYPE=Debug \
            -DALLOCAZAM_SANITIZER=thread

      - name: Build
        run: make -j
        working-directory: ./build_tsan

      - name: Test
        run: |
          ./tests/allocazam_std_allocator_smoke
          ./tests/allocazam_runner_expand_smoke
          ./tests/allocazam_std_allocator_expand_smoke
          ./tests/allocazam_concurrent_stress
        working-directory: ./build_tsan
